<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI考试工具</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        body { margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 360px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #409eff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn:hover { background: #66b1ff; }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-card">
            <h1>AI考试工具</h1>
            <input class="input" v-model="form.username" placeholder="用户名">
            <input class="input" type="password" v-model="form.password" placeholder="密码" @keyup.enter="login">
            <button class="btn" @click="login" :disabled="loading">{{ loading ? '登录中...' : '登录' }}</button>
            <p style="color:red;margin-top:10px;text-align:center;">{{ error }}</p>
        </div>
    </div>
    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const form = reactive({ username: '', password: '' });
                const loading = ref(false);
                const error = ref('');
                
                const login = async () => {
                    if (!form.username || !form.password) { error.value = '请输入用户名和密码'; return; }
                    loading.value = true;
                    error.value = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(form)
                        }).then(r => r.json());
                        if (res.success) {
                            localStorage.setItem('token', res.data.token);
                            localStorage.setItem('user', JSON.stringify(res.data.user));
                            location.href = '/dashboard-cdn.html';
                        } else {
                            error.value = res.message || '登录失败';
                        }
                    } catch(e) { error.value = '登录失败'; }
                    loading.value = false;
                };
                return { form, loading, error, login };
            }
        }).mount('#app');
    </script>
</body>
</html>
