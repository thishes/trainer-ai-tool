version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    ports:
      - "8080:8080"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:3000
    restart: unless-stopped
